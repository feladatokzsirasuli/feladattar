<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fizika interaktív feladatlap</title>
  <link rel="icon" href="data:," />
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --accent: #cc0000;
      --success: #15803d;
      --success-bg: #dcfce7;
      --error: #b91c1c;
      --error-bg: #fee2e2;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--primary);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      gap: 10px;
    }
    .sticky-header h1 {
      margin: 0;
      font-size: 1.15rem;
    }
    .status-bar {
      display: flex;
      gap: 15px;
      font-size: 0.95rem;
      font-weight: 600;
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 6px;
    }
    .container {
      max-width: 900px;
      margin: 25px auto 60px;
      padding: 0 15px;
    }
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 10px;
      margin-bottom: 16px;
      gap: 10px;
    }
    .task-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }
    .task-points {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .task-desc {
      margin-top: 0;
      margin-bottom: 16px;
      color: #334155;
    }
    .situation-box {
      background: #f1f5f9;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-style: italic;
    }
    .svg-wrapper {
      text-align: center;
      margin: 15px 0;
      overflow-x: auto;
    }
    .svg-wrapper svg {
      max-width: 100%;
      height: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
    }
    /* Drag Words */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      min-height: 48px;
    }
    .word-chip {
      background: #fff;
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }
    .word-chip.selected {
      background: var(--primary);
      color: #fff;
    }
    .word-chip.used {
      opacity: 0.4;
      pointer-events: none;
    }
    .drop-slot {
      display: inline-block;
      min-width: 110px;
      min-height: 30px;
      padding: 2px 10px;
      margin: 2px 4px;
      border-bottom: 2px dashed var(--primary);
      background: var(--primary-light);
      border-radius: 4px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      vertical-align: middle;
    }
    .drop-slot.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }
    .drop-slot.incorrect {
      background: var(--error-bg);
      border-color: var(--error);
      color: var(--error);
    }
    /* Blanks */
    .blank-input {
      border: 2px solid var(--border);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 0.95rem;
      width: 150px;
      margin: 2px 4px;
      font-weight: 600;
    }
    .blank-input.correct {
      border-color: var(--success);
      background: var(--success-bg);
      color: var(--success);
    }
    .blank-input.incorrect {
      border-color: var(--error);
      background: var(--error-bg);
      color: var(--error);
    }
    /* Group */
    .group-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      margin-bottom: 16px;
      min-height: 50px;
    }
    .group-item {
      background: #fff;
      border: 1px solid #94a3b8;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: all 0.15s;
    }
    .group-item.selected {
      border: 2px solid var(--primary);
      background: var(--primary-light);
      font-weight: 600;
    }
    .group-item.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }
    .group-item.incorrect {
      background: var(--error-bg);
      border-color: var(--error);
      color: var(--error);
    }
    .group-boxes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .group-box {
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      padding: 12px;
      min-height: 140px;
      background: #fafafa;
      cursor: pointer;
    }
    .group-box h4 {
      margin: 0 0 10px 0;
      text-align: center;
      color: var(--primary);
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 6px;
    }
    .group-box-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* Multi */
    .multi-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .multi-option.correct {
      background: var(--success-bg);
      border-color: var(--success);
    }
    .multi-option.incorrect {
      background: var(--error-bg);
      border-color: var(--error);
    }
    /* Order */
    .order-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .order-item.correct {
      background: var(--success-bg);
      border-color: var(--success);
    }
    .order-item.incorrect {
      background: var(--error-bg);
      border-color: var(--error);
    }
    .order-btns button {
      background: #e2e8f0;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 4px;
    }
    /* Hotspot */
    .hotspot-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    .hotspot-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hotspot-questions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }
    .hotspot-q-row {
      background: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .hotspot-q-row select {
      width: 100%;
      padding: 6px;
      margin-top: 6px;
      border-radius: 4px;
      border: 1px solid #94a3b8;
    }
    .hotspot-q-row.correct { background: var(--success-bg); border-color: var(--success); }
    .hotspot-q-row.incorrect { background: var(--error-bg); border-color: var(--error); }
    /* Crossword */
    .cw-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: flex-start;
    }
    .cw-grid {
      display: grid;
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 6px;
      width: max-content;
    }
    .cw-cell {
      width: 36px;
      height: 36px;
      background: #1e293b;
      position: relative;
    }
    .cw-cell.active {
      background: #fff;
    }
    .cw-cell input {
      width: 100%;
      height: 100%;
      border: none;
      text-align: center;
      font-size: 1.05rem;
      font-weight: bold;
      text-transform: uppercase;
      background: transparent;
      padding: 0;
    }
    .cw-cell input.correct { background: var(--success-bg); color: var(--success); }
    .cw-cell input.incorrect { background: var(--error-bg); color: var(--error); }
    .cw-num {
      position: absolute;
      top: 1px;
      left: 3px;
      font-size: 0.65rem;
      font-weight: bold;
      color: var(--primary);
      pointer-events: none;
    }
    .cw-clues {
      flex: 1;
      min-width: 250px;
    }
    .cw-clues h4 { margin: 0 0 6px 0; color: var(--primary); }
    .cw-clues ul { padding-left: 20px; margin-top: 0; }
    /* Buttons */
    .btn-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
	  align-items: center;
    }
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-check { background: var(--primary); color: #fff; }
    .btn-check:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-retry { background: #f59e0b; color: #fff; display: none; }
    .btn-sol { background: #64748b; color: #fff; display: none; }
    .feedback-msg {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .solution-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #fef9c3;
      border-left: 4px solid #eab308;
      border-radius: 4px;
      display: none;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>

  <div class="sticky-header">
    <h1 id="page-title">Fizika interaktív feladatlap</h1>
    <div class="status-bar">
      <span>Tanuló: <strong id="hdr-student">—</strong></span>
      <span>Ellenőrizve: <strong id="hdr-checked">0 / 0</strong></span>
      <span>Pont: <strong id="hdr-score">0 / 0</strong></span>
    </div>
  </div>

  <div class="container" id="tasks-container">
    <div class="task-card">
      <h2>Feladatlap betöltése...</h2>
      <p>Kérlek várj...</p>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC4ypKsFziwbyOQ87Sb-1PrrIZcvLf1_xQ",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebasedatabase.app",
    projectId: "fizikadomino",
    storageBucket: "fizikadomino.firebasestorage.app",
    messagingSenderId: "272119065201",
    appId: "1:272119065201:web:c6bdc223fd9a61394f49d0",
    measurementId: "G-6PNNLQV1GH"
  };

  firebase.initializeApp(firebaseConfig);
  const adatbazis = firebase.database();

  let diakNeve = "";
  let marMentve = false;
  let feladatAdatok = null;
  let reszEredmenyek = {};
  let selectedChip = null;
  let selectedGroupItem = null;

  function getTemaParam() {
    const params = new URLSearchParams(window.location.search);
    let tema = params.get("tema") || "fenytan";
    if (tema.indexOf("tema=") === 0) tema = tema.slice(5);
    return tema.replace(/[^a-zA-Z0-9_-]/g, "");
  }

  window.addEventListener("load", function() {
    const tema = getTemaParam();
    const script = document.createElement("script");
    script.src = tema + ".js";
    script.onload = function() {
      if (window.FELADAT_ADATOK) {
        feladatAdatok = window.FELADAT_ADATOK;
        document.getElementById("page-title").textContent = feladatAdatok.cim || "Fizika feladatlap";
        renderAllTasks();
        updateHeader();
        kerjNevet();
      } else {
        showLoadError("A betöltött fájl nem tartalmaz érvényes feladatadatokat.");
      }
    };
    script.onerror = function() {
      showLoadError("Nem található a témakör fájlja: " + tema + ".js");
    };
    document.body.appendChild(script);
  });

  function showLoadError(msg) {
    document.getElementById("tasks-container").innerHTML =
      '<div class="task-card" style="border-color:#cc0000;"><h2 style="color:#cc0000;">Hiba a betöltéskor</h2><p>' + msg + '</p></div>';
  }

  function kerjNevet() {
    let beirtNev = prompt("Kérlek, add meg a teljes nevedet a feladat megkezdéséhez:");
    if (beirtNev === null || beirtNev === undefined || beirtNev.trim() === "") {
      alert("A név megadása kötelező a feladat elindításához!");
      kerjNevet();
      return;
    }
    diakNeve = beirtNev.trim();
    document.getElementById("hdr-student").textContent = diakNeve;

    const fid = feladatAdatok.feladat_id || ("h5p_" + getTemaParam());
    const ellenorzoKulcs = (diakNeve + "_" + fid).toLowerCase();

    adatbazis.ref("Szorgalmi").orderByChild("nev_feladat").equalTo(ellenorzoKulcs).once("value")
      .then(function(snapshot) {
        if (snapshot.exists()) {
          alert("Figyelem! Ezt a konkrét feladatsort ezzel a névvel (" + diakNeve + ") már egyszer beküldted! Gyakorolni szabad, de új pontszámot nem rögzítek a naplóba.");
          marMentve = true;
        } else {
          marMentve = false;
        }
        megjelenitSzabalyzatot();
      })
      .catch(function(err) {
        console.error("Firebase ellenőrzési hiba:", err);
        megjelenitSzabalyzatot();
      });
  }

  function megjelenitSzabalyzatot() {
    const overlay = document.createElement("div");
    overlay.id = "szabalyzat-modal-overlay";
    overlay.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:99999;display:flex;justify-content:center;align-items:center;";
    overlay.innerHTML =
      '<div style="background:#fff;border-top:6px solid #cc0000;width:90%;max-width:500px;padding:25px;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.3);">' +
      '<h3 style="color:#cc0000;margin-top:0;text-align:center;">⚠️ Fontos szabályok a kitöltéshez!</h3>' +
      '<p>Mielőtt hozzáfognál a feladatokhoz, kérlek olvasd el figyelmesen a szabályokat:</p>' +
      '<ul style="padding-left:20px;line-height:1.6;">' +
      '<li>Minden feladat megoldása után rá <strong>KELL</strong> kattintanod az <strong>Ellenőrzés</strong> gombra!</li>' +
      '<li>Az Ellenőrzés gomb megnyomása után a válaszod rögzül, azt utólag már <strong>NEM lehet módosítani</strong>!</li>' +
      '<li>A pontjaidat a rendszer automatikusan küldi a tanári naplóba, amint az összes feladatot leellenőrizted.</li>' +
      '</ul>' +
      '<div style="text-align:center;margin-top:20px;">' +
      '<button id="btn-accept-rules" style="background:#cc0000;color:#fff;border:none;padding:12px 25px;font-size:15px;font-weight:bold;border-radius:5px;cursor:pointer;">Értettem, kezdem a feladatot!</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    document.getElementById("btn-accept-rules").onclick = function() {
      overlay.remove();
    };
  }

  function getTotalMaxPoints() {
    if (!feladatAdatok || !feladatAdatok.feladatok) return 0;
    return feladatAdatok.feladatok.reduce(function(sum, t) { return sum + (t.pont || 0); }, 0);
  }

  function updateHeader() {
    const totalTasks = feladatAdatok && feladatAdatok.feladatok ? feladatAdatok.feladatok.length : 0;
    const checkedCount = Object.keys(reszEredmenyek).length;
    let earned = 0;
    for (let k in reszEredmenyek) earned += reszEredmenyek[k].elert;
    document.getElementById("hdr-checked").textContent = checkedCount + " / " + totalTasks;
    document.getElementById("hdr-score").textContent = earned + " / " + getTotalMaxPoints();
  }

  function normalizeText(str) {
    return String(str || "").trim().toLowerCase().replace(/\s+/g, " ");
  }

  function renderAllTasks() {
    const container = document.getElementById("tasks-container");
    container.innerHTML = "";
    feladatAdatok.feladatok.forEach(function(task, idx) {
      const card = document.createElement("div");
      card.className = "task-card";
      card.id = "task-card-" + idx;

      let html =
        '<div class="task-header">' +
        '<h3 class="task-title">' + (task.cim || ((idx + 1) + ". feladat")) + '</h3>' +
        '<span class="task-points">' + (task.pont || 0) + ' pont</span>' +
        '</div>';

      if (task.leiras) html += '<p class="task-desc">' + task.leiras + '</p>';
      if (task.szituacio) html += '<div class="situation-box">' + task.szituacio + '</div>';
      if (task.svg && task.tipus !== "hotspot") html += '<div class="svg-wrapper">' + task.svg + '</div>';

      html += '<div id="task-body-' + idx + '"></div>';
      html +=
        '<div class="btn-row">' +
        '<button class="btn btn-check" id="btn-check-' + idx + '">Ellenőrzés</button>' +
        '<button class="btn btn-retry" id="btn-retry-' + idx + '">Újra</button>' +
        '<button class="btn btn-sol" id="btn-sol-' + idx + '">Megoldás mutatása</button>' +
        '<span class="feedback-msg" id="fb-' + idx + '"></span>' +
        '</div>' +
        '<div class="solution-box" id="sol-box-' + idx + '"></div>';

      card.innerHTML = html;
      container.appendChild(card);

      const bodyEl = document.getElementById("task-body-" + idx);
      if (task.tipus === "drag_words") renderDragWords(task, idx, bodyEl);
      else if (task.tipus === "blanks") renderBlanks(task, idx, bodyEl);
      else if (task.tipus === "group") renderGroup(task, idx, bodyEl);
      else if (task.tipus === "multi") renderMulti(task, idx, bodyEl);
      else if (task.tipus === "order") renderOrder(task, idx, bodyEl);
      else if (task.tipus === "hotspot") renderHotspot(task, idx, bodyEl);
      else if (task.tipus === "crossword") renderCrossword(task, idx, bodyEl);

      document.getElementById("btn-check-" + idx).onclick = function() { checkTask(task, idx); };
      document.getElementById("btn-retry-" + idx).onclick = function() { retryTask(task, idx); };
      document.getElementById("btn-sol-" + idx).onclick = function() {
        const sb = document.getElementById("sol-box-" + idx);
        sb.style.display = sb.style.display === "block" ? "none" : "block";
      };
    });
  }

  /* 1. DRAG WORDS */
  function renderDragWords(task, idx, el) {
    let rawText = task.szoveg || (Array.isArray(task.mondatok) ? task.mondatok.join(" ") : "");
    let answers = [];
    let slotIdx = 0;

    let processedText = rawText.replace(new RegExp("\\{([0-9]+)\\}", "g"), function(_, num) {
      const i = parseInt(num, 10);
      const ans = task.helyes ? task.helyes[i] : "";
      answers.push(ans);
      return '<span class="drop-slot" data-task="' + idx + '" data-slot="' + (slotIdx++) + '">...</span>';
    });

    if (answers.length === 0) {
      processedText = rawText.replace(new RegExp("\\*([^*]+)\\*", "g"), function(_, ans) {
        answers.push(ans.trim());
        return '<span class="drop-slot" data-task="' + idx + '" data-slot="' + (slotIdx++) + '">...</span>';
      });
    }

    task._parsedAnswers = answers;
    let pool = answers.slice();
	if (Array.isArray(task.extra)) pool = pool.concat(task.extra);
    if (Array.isArray(task.szavak) && task.szavak.length >= pool.length) pool = task.szavak.slice();
    pool.sort(function() { return Math.random() - 0.5; });

    let bankHtml = '<div class="word-bank" id="bank-' + idx + '">';
    pool.forEach(function(w, wIdx) {
      bankHtml += '<span class="word-chip" data-task="' + idx + '" data-widx="' + wIdx + '" data-word="' + w + '">' + w + '</span>';
    });
    bankHtml += '</div>';

    el.innerHTML = bankHtml + '<div class="dw-text">' + processedText + '</div>';

    el.querySelectorAll(".word-chip").forEach(function(chip) {
      chip.onclick = function() {
        if (chip.classList.contains("used")) return;
        el.querySelectorAll(".word-chip").forEach(function(c) { c.classList.remove("selected"); });
        chip.classList.add("selected");
        selectedChip = chip;
      };
    });

    el.querySelectorAll(".drop-slot").forEach(function(slot) {
      slot.onclick = function() {
        if (slot.dataset.locked === "1") return;
        if (slot.dataset.widx) {
          const oldChip = el.querySelector('.word-chip[data-widx="' + slot.dataset.widx + '"]');
          if (oldChip) oldChip.classList.remove("used");
          slot.textContent = "...";
          delete slot.dataset.widx;
          delete slot.dataset.val;
        }
        if (selectedChip && selectedChip.dataset.task === String(idx)) {
          slot.textContent = selectedChip.dataset.word;
          slot.dataset.val = selectedChip.dataset.word;
          slot.dataset.widx = selectedChip.dataset.widx;
          selectedChip.classList.remove("selected");
          selectedChip.classList.add("used");
          selectedChip = null;
        }
      };
    });
  }

  /* 2. BLANKS */
  function renderBlanks(task, idx, el) {
    let rawText = task.szoveg || "";
    if (!rawText && Array.isArray(task.mondatok)) {
      rawText = task.mondatok.map(function(m) {
        return typeof m === "string" ? m : (m.kerdes || m.szoveg || "");
      }).join("<br><br>");
    }

    let answers = [];
    let bIdx = 0;

    let processed = rawText.replace(new RegExp("\\[([^\\]]+)\\]", "g"), function(_, grp) {
      answers.push(grp.split("|").map(function(s) { return s.trim(); }));
      return '<input type="text" class="blank-input" data-bidx="' + (bIdx++) + '" placeholder="..." />';
    });

    if (answers.length === 0) {
      processed = rawText.replace(new RegExp("\\{([0-9]+)\\}", "g"), function(_, num) {
        const i = parseInt(num, 10);
        const ans = task.helyes ? task.helyes[i] : "";
        answers.push(Array.isArray(ans) ? ans : String(ans).split("|"));
        return '<input type="text" class="blank-input" data-bidx="' + (bIdx++) + '" placeholder="..." />';
      });
    }

    if (answers.length === 0 && Array.isArray(task.mondatok)) {
      processed = task.mondatok.map(function(m, i) {
        const ans = m.helyes || (task.helyes ? task.helyes[i] : "");
        answers.push(Array.isArray(ans) ? ans : String(ans).split("|"));
        return '<div style="margin-bottom:10px;"><strong>' + (i + 1) + '.</strong> ' + (m.kerdes || m.meghatarozas || "") +
               ' <input type="text" class="blank-input" data-bidx="' + i + '" placeholder="Fogalom..." /></div>';
      }).join("");
    }

    task._parsedBlanks = answers;
    el.innerHTML = '<div>' + processed + '</div>';
  }

  /* 3. GROUP */
  function renderGroup(task, idx, el) {
    const cats = task.kategoriak || task.csoportok || [];
    const items = (task.elemek || []).map(function(it, i) {
      return { id: i, szoveg: it.szoveg, csoport: it.csoport };
    }).sort(function() { return Math.random() - 0.5; });

    let html = '<div class="group-pool" id="gpool-' + idx + '">';
    items.forEach(function(it) {
      html += '<div class="group-item" data-id="' + it.id + '" data-target="' + it.csoport + '">' + it.szoveg + '</div>';
    });
    html += '</div><div class="group-boxes">';
    cats.forEach(function(c, cIdx) {
      html += '<div class="group-box" data-cidx="' + cIdx + '" data-cname="' + c + '"><h4>' + c + '</h4><div class="group-box-items"></div></div>';
    });
    html += '</div>';
    el.innerHTML = html;

    el.querySelectorAll(".group-item").forEach(function(item) {
      item.onclick = function(e) {
        e.stopPropagation();
        if (item.dataset.locked === "1") return;
        if (item.parentElement.classList.contains("group-box-items")) {
          document.getElementById("gpool-" + idx).appendChild(item);
          item.classList.remove("selected");
          selectedGroupItem = null;
          return;
        }
        el.querySelectorAll(".group-item").forEach(function(x) { x.classList.remove("selected"); });
        item.classList.add("selected");
        selectedGroupItem = item;
      };
    });

    el.querySelectorAll(".group-box").forEach(function(box) {
      box.onclick = function() {
        if (selectedGroupItem && el.contains(selectedGroupItem)) {
          box.querySelector(".group-box-items").appendChild(selectedGroupItem);
          selectedGroupItem.classList.remove("selected");
          selectedGroupItem = null;
        }
      };
    });
  }

  /* 4. MULTI */
  function renderMulti(task, idx, el) {
    const opts = task.opciok || task.valaszok || [];
    let html = "";
    opts.forEach(function(o, oIdx) {
      const text = typeof o === "string" ? o : o.szoveg;
      const isOk = typeof o === "object" ? !!o.helyes : (Array.isArray(task.helyes) && task.helyes.indexOf(oIdx) !== -1);
      html +=
        '<label class="multi-option" data-ok="' + (isOk ? "1" : "0") + '">' +
        '<input type="checkbox" value="' + oIdx + '" /> <span>' + text + '</span>' +
        '</label>';
    });
    el.innerHTML = html;
  }

  /* 5. ORDER */
  function renderOrder(task, idx, el) {
    const steps = (task.lepesek || task.elemek || []).map(function(s, i) {
      return { origIdx: i, text: typeof s === "string" ? s : s.szoveg };
    }).sort(function() { return Math.random() - 0.5; });

    let html = '<ul class="order-list" id="olist-' + idx + '">';
    steps.forEach(function(st) {
      html +=
        '<li class="order-item" data-orig="' + st.origIdx + '">' +
        '<span>' + st.text + '</span>' +
        '<div class="order-btns">' +
        '<button type="button" class="btn-up">▲</button>' +
        '<button type="button" class="btn-down">▼</button>' +
        '</div></li>';
    });
    html += '</ul>';
    el.innerHTML = html;

    el.querySelectorAll(".btn-up").forEach(function(btn) {
      btn.onclick = function() {
        const li = btn.closest(".order-item");
        if (li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling);
      };
    });
    el.querySelectorAll(".btn-down").forEach(function(btn) {
      btn.onclick = function() {
        const li = btn.closest(".order-item");
        if (li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li);
      };
    });
  }

  /* 6. HOTSPOT */
  function renderHotspot(task, idx, el) {
    const pts = task.pontok || [];
    let pinsHtml = "";
    let qHtml = '<div class="hotspot-questions">';

    pts.forEach(function(p, pIdx) {
      const label = p.szam || (pIdx + 1);
      pinsHtml += '<div class="hotspot-pin" style="left:' + p.x + '%;top:' + p.y + '%;">' + label + '</div>';

      let rawOpts = p.opciok || p.valaszok || [];
      let optList = rawOpts.map(function(o) {
        return typeof o === "string" ? o : (o.szoveg || "");
      });

      let correctText = "";
      if (typeof p.helyes === "number" && optList[p.helyes] !== undefined) {
        correctText = optList[p.helyes];
      } else if (typeof p.helyes === "string") {
        correctText = p.helyes;
      } else {
        rawOpts.forEach(function(o) {
          if (typeof o === "object" && o.helyes) correctText = o.szoveg;
        });
      }

      qHtml +=
        '<div class="hotspot-q-row" data-correct="' + correctText + '">' +
        '<strong>' + label + '. pont:</strong> ' + (p.kerdes || "Mit jelöl ez a pont?") +
        '<select><option value="">-- Válassz --</option>';
      optList.forEach(function(optStr) {
        qHtml += '<option value="' + optStr + '">' + optStr + '</option>';
      });
      qHtml += '</select></div>';
    });
    qHtml += '</div>';

    el.innerHTML =
      '<div class="svg-wrapper"><div class="hotspot-container">' + (task.svg || "") + pinsHtml + '</div></div>' + qHtml;
  }

  /* 7. CROSSWORD */
  function renderCrossword(task, idx, el) {
    const words = (task.szavak || []).map(function(w, i) {
      return {
        num: w.szam || (i + 1),
        row: (w.sor !== undefined ? w.sor : w.row) - 1,
        col: (w.oszlop !== undefined ? w.oszlop : w.col) - 1,
        dir: (w.irany || w.dir || "V").toUpperCase(),
        word: (w.szo || w.word || "").toUpperCase(),
        clue: w.meghatarozas || w.clue || ""
      };
    });

    let maxR = 0, maxC = 0;
    words.forEach(function(w) {
      for (let i = 0; i < w.word.length; i++) {
        const r = w.dir === "F" || w.dir === "D" ? w.row + i : w.row;
        const c = w.dir === "V" || w.dir === "A" ? w.col + i : w.col;
        if (r > maxR) maxR = r;
        if (c > maxC) maxC = c;
      }
    });

    const rows = maxR + 1;
    const cols = maxC + 1;
    const gridData = Array.from({ length: rows }, function() { return Array(cols).fill(null); });

    words.forEach(function(w) {
      for (let i = 0; i < w.word.length; i++) {
        const r = w.dir === "F" || w.dir === "D" ? w.row + i : w.row;
        const c = w.dir === "V" || w.dir === "A" ? w.col + i : w.col;
        if (!gridData[r][c]) gridData[r][c] = { char: w.word[i], num: null };
        if (i === 0) gridData[r][c].num = w.num;
      }
    });

    let gridHtml = '<div class="cw-grid" style="grid-template-columns:repeat(' + cols + ', 36px);">';
    for (let r = 0; r < rows; r++) {
	for (let c = 0; c < cols; c++) {
        const cell = gridData[r][c];
        if (cell) {
          gridHtml +=
            '<div class="cw-cell active">' +
            (cell.num ? '<span class="cw-num">' + cell.num + '</span>' : '') +
            '<input type="text" maxlength="1" data-ans="' + cell.char + '" />' +
            '</div>';
        } else {
          gridHtml += '<div class="cw-cell"></div>';
        }
      }
    }
    gridHtml += '</div>';

    let vClues = "", fClues = "";
    words.forEach(function(w) {
      const li = '<li><strong>' + w.num + '.</strong> ' + w.clue + ' (' + w.word.length + ' betű)</li>';
      if (w.dir === "F" || w.dir === "D") fClues += li;
      else vClues += li;
    });

    el.innerHTML =
      '<div class="cw-wrapper">' + gridHtml +
      '<div class="cw-clues">' +
      (vClues ? '<h4>Vízszintes:</h4><ul>' + vClues + '</ul>' : '') +
      (fClues ? '<h4>Függőleges:</h4><ul>' + fClues + '</ul>' : '') +
      '</div></div>';
  }

  /* CHECK & SCORE */
  function checkTask(task, idx) {
    const el = document.getElementById("task-body-" + idx);
    const maxPts = task.pont || 0;
    let earned = 0;
    let solText = "";

    if (task.tipus === "drag_words") {
      const slots = el.querySelectorAll(".drop-slot");
      let okCount = 0;
      slots.forEach(function(s, i) {
        s.dataset.locked = "1";
        const expected = task._parsedAnswers[i];
        if (normalizeText(s.dataset.val) === normalizeText(expected)) {
          s.classList.add("correct");
          okCount++;
        } else {
          s.classList.add("incorrect");
        }
      });
      earned = Math.round((okCount / Math.max(1, slots.length)) * maxPts);
      solText = "Helyes sorrend: " + task._parsedAnswers.join(", ");
    }
    else if (task.tipus === "blanks") {
      const inputs = el.querySelectorAll(".blank-input");
      let okCount = 0;
      inputs.forEach(function(inp, i) {
        inp.disabled = true;
        const val = normalizeText(inp.value);
        const validList = task._parsedBlanks[i].map(normalizeText);
        if (validList.indexOf(val) !== -1) {
          inp.classList.add("correct");
          okCount++;
        } else {
          inp.classList.add("incorrect");
        }
      });
      earned = Math.round((okCount / Math.max(1, inputs.length)) * maxPts);
      solText = "Elfogadott válaszok: " + task._parsedBlanks.map(function(arr) { return arr.join(" / "); }).join("; ");
    }
    else if (task.tipus === "group") {
      const cats = task.kategoriak || task.csoportok || [];
      const allItems = el.querySelectorAll(".group-item");
      let okCount = 0;
      allItems.forEach(function(it) {
        it.dataset.locked = "1";
        const box = it.closest(".group-box");
        const target = it.dataset.target;
        if (box) {
          const boxIdx = box.dataset.cidx;
          const boxName = box.dataset.cname;
          if (target === boxIdx || normalizeText(target) === normalizeText(boxName)) {
            it.classList.add("correct");
            okCount++;
          } else {
            it.classList.add("incorrect");
          }
        } else {
          it.classList.add("incorrect");
        }
      });
      earned = Math.round((okCount / Math.max(1, allItems.length)) * maxPts);
      solText = cats.map(function(c, cIdx) {
        const names = (task.elemek || []).filter(function(e) {
          return String(e.csoport) === String(cIdx) || normalizeText(e.csoport) === normalizeText(c);
        }).map(function(e) { return e.szoveg; });
        return "<strong>" + c + ":</strong> " + names.join(", ");
      }).join("<br>");
    }
    else if (task.tipus === "multi") {
      const opts = el.querySelectorAll(".multi-option");
      let totalCorrect = 0, goodPicks = 0, badPicks = 0;
      let solArr = [];
      opts.forEach(function(opt) {
        const cb = opt.querySelector("input");
        cb.disabled = true;
        const isOk = opt.dataset.ok === "1";
        if (isOk) {
          totalCorrect++;
          solArr.push(opt.querySelector("span").textContent);
        }
        if (cb.checked && isOk) { opt.classList.add("correct"); goodPicks++; }
        else if (cb.checked && !isOk) { opt.classList.add("incorrect"); badPicks++; }
      });
      const rawScore = Math.max(0, goodPicks - badPicks);
      earned = Math.round((rawScore / Math.max(1, totalCorrect)) * maxPts);
      solText = "Helyes válaszok: " + solArr.join("; ");
    }
    else if (task.tipus === "order") {
      const items = el.querySelectorAll(".order-item");
      let okCount = 0;
      items.forEach(function(li, i) {
        li.querySelectorAll("button").forEach(function(b) { b.disabled = true; });
        if (li.dataset.orig === String(i)) {
          li.classList.add("correct");
          okCount++;
        } else {
          li.classList.add("incorrect");
        }
      });
      earned = Math.round((okCount / Math.max(1, items.length)) * maxPts);
      solText = "Helyes sorrend:<br>" + (task.lepesek || task.elemek || []).map(function(s, i) {
        return (i + 1) + ". " + (typeof s === "string" ? s : s.szoveg);
      }).join("<br>");
    }
    else if (task.tipus === "hotspot") {
      const rows = el.querySelectorAll(".hotspot-q-row");
      let okCount = 0;
      let solArr = [];
      rows.forEach(function(r, i) {
        const sel = r.querySelector("select");
        sel.disabled = true;
        const ans = r.dataset.correct;
        solArr.push((i + 1) + ". pont: " + ans);
        if (normalizeText(sel.value) === normalizeText(ans) && ans !== "") {
          r.classList.add("correct");
          okCount++;
        } else {
          r.classList.add("incorrect");
        }
      });
      earned = Math.round((okCount / Math.max(1, rows.length)) * maxPts);
      solText = solArr.join(" | ");
    }
    else if (task.tipus === "crossword") {
      const inputs = el.querySelectorAll(".cw-cell input");
      let okCount = 0;
      inputs.forEach(function(inp) {
        inp.disabled = true;
        if (normalizeText(inp.value) === normalizeText(inp.dataset.ans)) {
          inp.classList.add("correct");
          okCount++;
        } else {
          inp.classList.add("incorrect");
        }
      });
      earned = Math.round((okCount / Math.max(1, inputs.length)) * maxPts);
      solText = (task.szavak || []).map(function(w, i) {
        return (w.szam || (i + 1)) + ". " + (w.szo || w.word);
      }).join(", ");
    }

    document.getElementById("btn-check-" + idx).disabled = true;
    document.getElementById("fb-" + idx).textContent = "Elért pontszám: " + earned + " / " + maxPts + " pont";
    document.getElementById("sol-box-" + idx).innerHTML = solText;

    if (!(idx in reszEredmenyek)) {
      reszEredmenyek[idx] = { elert: earned, max: maxPts };
    }
    updateHeader();
    checkCompletionAndSubmit();
  }

  function retryTask(task, idx) {
    const bodyEl = document.getElementById("task-body-" + idx);
    bodyEl.innerHTML = "";
    if (task.tipus === "drag_words") renderDragWords(task, idx, bodyEl);
    else if (task.tipus === "blanks") renderBlanks(task, idx, bodyEl);
    else if (task.tipus === "group") renderGroup(task, idx, bodyEl);
    else if (task.tipus === "multi") renderMulti(task, idx, bodyEl);
    else if (task.tipus === "order") renderOrder(task, idx, bodyEl);
    else if (task.tipus === "hotspot") renderHotspot(task, idx, bodyEl);
    else if (task.tipus === "crossword") renderCrossword(task, idx, bodyEl);

    document.getElementById("btn-check-" + idx).disabled = false;
    document.getElementById("fb-" + idx).textContent = "";
    document.getElementById("sol-box-" + idx).style.display = "none";
  }

  function revealPracticeButtons() {
    feladatAdatok.feladatok.forEach(function(_, idx) {
      document.getElementById("btn-retry-" + idx).style.display = "inline-block";
      document.getElementById("btn-sol-" + idx).style.display = "inline-block";
    });
  }

  function checkCompletionAndSubmit() {
    const totalTasks = feladatAdatok.feladatok.length;
    if (Object.keys(reszEredmenyek).length < totalTasks) return;

    if (marMentve) {
      revealPracticeButtons();
      return;
    }

    let vegsoElertPont = 0;
    let vegsoMaxPont = 0;
    for (let id in reszEredmenyek) {
      vegsoElertPont += reszEredmenyek[id].elert;
      vegsoMaxPont += reszEredmenyek[id].max;
    }

    marMentve = true;
    const fid = feladatAdatok.feladat_id || ("h5p_" + getTemaParam());
    const fname = feladatAdatok.feladat || getTemaParam();

    const vegsoEredmeny = {
      name: diakNeve,
      feladat_id: fid,
      nev_feladat: (diakNeve + "_" + fid).toLowerCase(),
      score: vegsoElertPont,
      max_score: vegsoMaxPont,
      feladat: fname,
      idobelyeg: new Date().toLocaleString("hu-HU")
    };

    adatbazis.ref("Szorgalmi").push(vegsoEredmeny)
      .then(function() {
        revealPracticeButtons();
        alert("Köszönöm! A teljes feladatsort befejezted. A végső elért pontszámodat (" + vegsoElertPont + " / " + vegsoMaxPont + ") sikeresen rögzítettem a naplóba.\n\nMostantól átnézheted a hibáidat a feladatok alatt!");
      })
      .catch(function(error) {
        console.error("Firebase küldési hiba:", error);
        marMentve = false;
      });
  }
</script>
